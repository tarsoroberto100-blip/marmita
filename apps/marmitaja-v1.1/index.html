<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarmitaJá — Peça sua marmita</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🍱 MarmitaJá</h1>
  <p>Comida caseira entregue no almoço</p>
</header>
<main>
  <section class="card">
    <h2>Monte seu pedido</h2>
    <div class="cardapio">
      <div class="prato"><strong>Marmita P</strong><span>R$ 18,00</span></div>
      <div class="prato"><strong>Marmita M</strong><span>R$ 22,00</span></div>
      <div class="prato"><strong>Marmita G</strong><span>R$ 26,00</span></div>
    </div>
    <div class="linha">
      <label>Tamanho
        <select id="tamanho">
          <option value="P">P — R$ 18,00</option>
          <option value="M" selected>M — R$ 22,00</option>
          <option value="G">G — R$ 26,00</option>
        </select>
      </label>
      <label>Quantidade
        <input id="quantidade" type="number" value="1" min="1">
      </label>
    </div>
    <button type="button" id="btn-adicionar">Adicionar ao carrinho</button>
    <p id="msg-item" class="mensagem" role="alert"></p>
  </section>
  <section class="card">
    <h2>Carrinho</h2>
    <table>
      <thead><tr><th>Item</th><th>Qtd.</th><th>Preço</th><th></th></tr></thead>
      <tbody id="carrinho"></tbody>
    </table>
    <p id="vazio" class="vazio">Seu carrinho está vazio.</p>
    <div class="linha">
      <label>CEP de entrega
        <input id="cep" type="text" placeholder="60000-000">
      </label>
      <label>Cupom
        <input id="cupom" type="text" placeholder="Opcional">
      </label>
    </div>
    <div class="resumo">
      <p>Subtotal <span id="subtotal">R$ 0,00</span></p>
      <p>Frete <span id="frete">R$ 0,00</span></p>
      <p>Desconto <span id="desconto">R$ 0,00</span></p>
      <p class="total">Total <span id="total">R$ 0,00</span></p>
    </div>
    <button type="button" id="btn-finalizar">Finalizar pedido</button>
    <p id="mensagem" class="mensagem" role="alert"></p>
  </section>
</main>
<footer>MarmitaJá v1.1 · Projeto da turma</footer>
<script src="js/regras.js"></script>
<script src="js/app.js"></script>
</body>
</html>
